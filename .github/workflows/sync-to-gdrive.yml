name: Sync Code to Google Drive

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 파일 합치기
      - name: Combine Source Code
        run: |
          echo "=== 1. INDEX.HTML ===" > timer_source.txt
          cat index.html >> timer_source.txt 2>/dev/null || true
          echo -e "\n\n=== 2. APP.JS ===" >> timer_source.txt
          cat app.js >> timer_source.txt 2>/dev/null || true
          echo -e "\n\n=== 3. STYLE.CSS ===" >> timer_source.txt
          cat style.css >> timer_source.txt 2>/dev/null || true

      # 2. 구글 드라이브 업로드용 파이썬 라이브러리 설치
      - name: Set up Python & Dependencies
        run: |
          pip install google-api-python-client google-auth

      # 3. 구글 드라이브에 업로드 실행 (JSON 키 직접 사용)
      - name: Upload via Python
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_CREDENTIALS }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - << 'EOF'
          import os
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # 1. 인증 설정
          creds_dict = json.loads(os.environ['GDRIVE_JSON'])
          folder_id = os.environ['FOLDER_ID']
          creds = service_account.Credentials.from_service_account_info(
              creds_dict, scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          file_name = "갤럭시타이머_통합코드.txt"
          local_file_path = "timer_source.txt"

          # 2. 기존 동일 파일이 폴더에 있는지 확인
          query = f"'{folder_id}' in parents and name = '{file_name}' and trashed = false"
          results = service.files().list(q=query, fields="files(id, name)").execute()
          files = results.get('files', [])

          media = MediaFileUpload(local_file_path, mimetype='text/plain', resumable=True)

          if files:
              # 기존 파일 덮어쓰기(업데이트)
              file_id = files[0]['id']
              updated = service.files().update(fileId=file_id, media_body=media).execute()
              print(f"File updated successfully (ID: {file_id})")
          else:
              # 새 파일 생성
              file_metadata = {
                  'name': file_name,
                  'parents': [folder_id]
              }
              created = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
              print(f"File created successfully (ID: {created.get('id')})")
          EOF